# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Dev-only advisories from the mocha test runner (diff, serialize-javascript).
          # These packages are NOT bundled into the shipped action (dist/) and are already
          # at the highest versions mocha@11.7.6 ships; the fixes require major versions
          # mocha has not yet adopted. Mirrors the ignore list in osv-scanner.toml.
          allow-ghsas: GHSA-73rr-hh4g-fpgx, GHSA-5c6j-r48x-rmvq, GHSA-qj8w-gfj5-8c6v
